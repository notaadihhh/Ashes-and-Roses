<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roses and Ashes - Perfectly Aligned & Mirrored Viewer</title>
    <style>
        body {
            margin: 0; padding: 0; overflow: hidden;
            background-color: #141414;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #e0e0e0;
        }
        #canvas-container { width: 100vw; height: 100vh; display: block; }
        #ui-overlay {
            position: absolute; top: 16px; left: 16px;
            background: rgba(22, 22, 22, 0.9);
            padding: 18px; border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.12);
            width: 300px; z-index: 10;
            max-height: 92vh; overflow-y: auto;
        }
        h1 { font-size: 17px; margin: 0 0 6px 0; color: #fff; }
        p { font-size: 12px; margin: 0 0 12px 0; color: #aaa; line-height: 1.4; }
        .control-group { margin-bottom: 12px; }
        label { display: block; font-size: 11px; margin-bottom: 4px; color: #ccc; font-weight: 600; }
        button {
            background: #e50914; color: white; border: none; padding: 9px 14px;
            border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 12px; width: 100%;
        }
        button:hover { background: #f40612; }
        .batch-btn { background: #2b2b2b; border: 1px solid #444; margin-bottom: 10px; }
        .batch-btn:hover { background: #383838; }
        input[type="range"] { width: 100%; accent-color: #e50914; }
        .file-row {
            display: flex; align-items: center; justify-content: space-between;
            background: rgba(255,255,255,0.04); padding: 6px 8px;
            border-radius: 6px; margin-bottom: 6px; font-size: 11px;
        }
        .file-row span { color: #ddd; font-weight: 500; }
        .file-row input[type="file"] { width: 145px; font-size: 10px; color: #aaa; }
        .status { font-size: 11px; color: #4ade80; margin-bottom: 10px; min-height: 14px; }
        .instructions { margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.1); font-size: 11px; color: #888; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="ui-overlay">
        <h1>Roses and Ashes</h1>
        <p>Corrected Mirror Dieline Mockup</p>

        <div class="control-group">
            <button class="batch-btn" onclick="document.getElementById('batchInput').click()">
                📁 Select All 7 Images at Once
            </button>
            <input type="file" id="batchInput" multiple accept="image/*" style="display:none">
            <div class="status" id="statusText">Waiting for images...</div>
        </div>

        <div class="control-group">
            <button id="toggleLidBtn">Open / Close Lid</button>
        </div>

        <div class="control-group">
            <label for="lidSlider">Lid Hinge Angle: <span id="angleVal">0</span>°</label>
            <input type="range" id="lidSlider" min="0" max="75" value="0" step="1">
        </div>

        <label style="margin-top:12px;">Individual Panel Overrides:</label>
        <div class="file-row"><span>Front</span><input type="file" accept="image/*" data-panel="front"></div>
        <div class="file-row"><span>Lid Front</span><input type="file" accept="image/*" data-panel="lidFront"></div>
        <div class="file-row"><span>Top</span><input type="file" accept="image/*" data-panel="top"></div>
        <div class="file-row"><span>Back</span><input type="file" accept="image/*" data-panel="back"></div>
        <div class="file-row"><span>Bottom</span><input type="file" accept="image/*" data-panel="bottom"></div>
        <div class="file-row"><span>Outer Side 1</span><input type="file" accept="image/*" data-panel="side1"></div>
        <div class="file-row"><span>Outer Side 2</span><input type="file" accept="image/*" data-panel="side2"></div>

        <div class="instructions">
            • Left-click + drag to rotate<br>
            • Scroll to zoom • Right-click to pan
        </div>
    </div>

    <div id="canvas-container"></div>

    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x181818);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(2.8, 2.2, 6.2);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.outputEncoding = THREE.sRGBEncoding;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // Lighting
        scene.add(new THREE.AmbientLight(0xffffff, 0.85));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);
        const backLight = new THREE.DirectionalLight(0xffffff, 0.4);
        backLight.position.set(-5, -3, -6);
        scene.add(backLight);

        // Materials
        const materials = {
            front: new THREE.MeshStandardMaterial({ color: 0xeeeeee, roughness: 0.35 }),
            lidFront: new THREE.MeshStandardMaterial({ color: 0xdddddd, roughness: 0.35 }),
            top: new THREE.MeshStandardMaterial({ color: 0xcccccc, roughness: 0.35 }),
            back: new THREE.MeshStandardMaterial({ color: 0xeeeeee, roughness: 0.35 }),
            bottom: new THREE.MeshStandardMaterial({ color: 0xcccccc, roughness: 0.35 }),
            side1: new THREE.MeshStandardMaterial({ color: 0xe5e5e5, roughness: 0.35 }),
            side2: new THREE.MeshStandardMaterial({ color: 0xe5e5e5, roughness: 0.35 }),
            redPlaceholder: new THREE.MeshStandardMaterial({ color: 0xdc2626, roughness: 0.4 }),
            greenFiller: new THREE.MeshStandardMaterial({ color: 0x16a34a, roughness: 0.4 })
        };

        const boxWidth = 2.2;
        const boxDepth = 0.88;
        const boxHeight = 3.4;
        const lidFrontHeight = 1.1; // Longer side at front
        const lidBackHeight = 0.35; // Shorter side at back
        const bodyHeight = boxHeight - lidFrontHeight;

        const masterGroup = new THREE.Group();
        scene.add(masterGroup);

        // --- CONTINUOUS BACK PANEL ---
        const backMesh = new THREE.Mesh(new THREE.PlaneGeometry(boxWidth, boxHeight), materials.back);
        backMesh.position.set(0, 0, -boxDepth / 2);
        backMesh.rotation.y = Math.PI;
        masterGroup.add(backMesh);

        // --- LOWER BODY ---
        const lowerBodyGroup = new THREE.Group();
        masterGroup.add(lowerBodyGroup);

        // Inner charcoal collar & cigarettes
        const collar = new THREE.Mesh(
            new THREE.BoxGeometry(boxWidth - 0.06, 0.7, boxDepth - 0.06),
            new THREE.MeshStandardMaterial({ color: 0x1e1e1e, roughness: 0.85 })
        );
        collar.position.set(0, boxHeight / 2 - lidFrontHeight - 0.1, 0);
        lowerBodyGroup.add(collar);

        for (let r = 0; r < 2; r++) {
            for (let c = 0; c < 10; c++) {
                const cig = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.085, 0.085, 0.5, 12),
                    new THREE.MeshStandardMaterial({ color: 0xf4efe6, roughness: 0.6 })
                );
                cig.position.set(
                    -boxWidth / 2 + 0.22 + c * 0.195,
                    boxHeight / 2 - lidFrontHeight + 0.18,
                    (r === 0 ? -0.18 : 0.18)
                );
                lowerBodyGroup.add(cig);
            }
        }

        // Lower Front Panel
        const frontMesh = new THREE.Mesh(new THREE.PlaneGeometry(boxWidth, bodyHeight), materials.front);
        frontMesh.position.set(0, -lidFrontHeight / 2, boxDepth / 2);
        lowerBodyGroup.add(frontMesh);

        // Bottom Panel
        const bottomMesh = new THREE.Mesh(new THREE.PlaneGeometry(boxWidth, boxDepth), materials.bottom);
        bottomMesh.position.set(0, -boxHeight / 2, 0);
        bottomMesh.rotation.x = Math.PI / 2;
        lowerBodyGroup.add(bottomMesh);

        // Lower Side Panels (Rectangular side.png + Correctly Mirrored Green Filler Triangle)
        function createLowerSideWithGreenFiller(isLeft) {
            const group = new THREE.Group();
            
            const rectMesh = new THREE.Mesh(
                new THREE.PlaneGeometry(boxDepth, bodyHeight),
                materials[isLeft ? 'side1' : 'side2']
            );
            rectMesh.position.set(0, -lidFrontHeight / 2, 0);
            group.add(rectMesh);

            // Correctly mirrored green triangle: taller vertical edge at the back, sloping to zero at the front
            const frontX = isLeft ? boxDepth / 2 : -boxDepth / 2;
            const backX = isLeft ? -boxDepth / 2 : boxDepth / 2;
            const slopeHeight = lidFrontHeight - lidBackHeight;

            const triShape = new THREE.Shape();
            triShape.moveTo(frontX, 0);            // front-bottom
            triShape.lineTo(backX, 0);             // back-bottom
            triShape.lineTo(backX, slopeHeight);    // back-top (taller edge at the back)
            triShape.closePath();

            const triMesh = new THREE.Mesh(new THREE.ShapeGeometry(triShape), materials.greenFiller);
            triMesh.position.set(0, boxHeight / 2 - lidFrontHeight, 0.001);
            group.add(triMesh);

            return group;
        }

        const lowerSide1 = createLowerSideWithGreenFiller(true);
        lowerSide1.position.set(-boxWidth / 2, 0, 0);
        lowerSide1.rotation.y = -Math.PI / 2;
        lowerBodyGroup.add(lowerSide1);

        const lowerSide2 = createLowerSideWithGreenFiller(false);
        lowerSide2.position.set(boxWidth / 2, 0, 0);
        lowerSide2.rotation.y = Math.PI / 2;
        lowerBodyGroup.add(lowerSide2);


        // --- HINGED TRAPEZOIDAL LID ---
        const lidGroup = new THREE.Group();
        lidGroup.position.set(0, boxHeight / 2 - lidBackHeight, -boxDepth / 2);
        masterGroup.add(lidGroup);

        const lidContents = new THREE.Group();
        lidContents.position.set(0, 0, boxDepth / 2);
        lidGroup.add(lidContents);

        // Lid Front Panel (Taller side at front)
        const lidFrontMesh = new THREE.Mesh(new THREE.PlaneGeometry(boxWidth, lidFrontHeight), materials.lidFront);
        lidFrontMesh.position.set(0, -lidFrontHeight / 2 + lidBackHeight, boxDepth / 2);
        lidContents.add(lidFrontMesh);

        // Lid Top Crown
        const lidTopMesh = new THREE.Mesh(new THREE.PlaneGeometry(boxWidth, boxDepth), materials.top);
        lidTopMesh.position.set(0, lidBackHeight, 0);
        lidTopMesh.rotation.x = -Math.PI / 2;
        lidContents.add(lidTopMesh);

        // Lid Side Flaps (Trapezoidal Red Placeholders: taller at front, shorter at back)
        function createLidSideRedFlap(isLeft) {
            const frontX = isLeft ? boxDepth / 2 : -boxDepth / 2;
            const backX = isLeft ? -boxDepth / 2 : boxDepth / 2;

            const shape = new THREE.Shape();
            shape.moveTo(backX, 0);                                    // back bottom (hinge - shorter edge)
            shape.lineTo(frontX, -lidFrontHeight + lidBackHeight);     // front bottom (longer edge)
            shape.lineTo(frontX, lidBackHeight);                       // front top
            shape.lineTo(backX, lidBackHeight);                        // back top
            shape.closePath();

            return new THREE.Mesh(new THREE.ShapeGeometry(shape), materials.redPlaceholder);
        }

        const lidSide1 = createLidSideRedFlap(true);
        lidSide1.position.set(-boxWidth / 2, 0, 0);
        lidSide1.rotation.y = -Math.PI / 2;
        lidContents.add(lidSide1);

        const lidSide2 = createLidSideRedFlap(false);
        lidSide2.position.set(boxWidth / 2, 0, 0);
        lidSide2.rotation.y = Math.PI / 2;
        lidContents.add(lidSide2);


        // --- IMAGE LOADER ---
        function applyImageFile(panelKey, file) {
            if (!file || !materials[panelKey]) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const tex = new THREE.Texture(img);
                    tex.encoding = THREE.sRGBEncoding;
                    tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
                    tex.needsUpdate = true;

                    materials[panelKey].map = tex;
                    materials[panelKey].color.setHex(0xffffff);
                    materials[panelKey].needsUpdate = true;
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        document.querySelectorAll('input[data-panel]').forEach(input => {
            input.addEventListener('change', (e) => {
                if (e.target.files[0]) {
                    applyImageFile(e.target.dataset.panel, e.target.files[0]);
                    document.getElementById('statusText').innerText = `Updated ${e.target.dataset.panel}`;
                }
            });
        });

        document.getElementById('batchInput').addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            let matched = 0;
            files.forEach(file => {
                const name = file.name.toLowerCase().replace(/[\s_-]/g, '');
                let key = null;
                if (name.includes('lidfront')) key = 'lidFront';
                else if (name.includes('front')) key = 'front';
                else if (name.includes('top')) key = 'top';
                else if (name.includes('back')) key = 'back';
                else if (name.includes('bottom')) key = 'bottom';
                else if (name.includes('side1')) key = 'side1';
                else if (name.includes('side2')) key = 'side2';

                if (key) {
                    applyImageFile(key, file);
                    matched++;
                }
            });
            document.getElementById('statusText').innerText = `Loaded ${matched} of ${files.length} images!`;
        });

        // --- CONTROLS ---
        let targetOpen = 0, currentOpen = 0;
        const lidSlider = document.getElementById('lidSlider');
        const angleVal = document.getElementById('angleVal');

        lidSlider.addEventListener('input', (e) => { targetOpen = parseInt(e.target.value) / 75; });
        document.getElementById('toggleLidBtn').addEventListener('click', () => {
            targetOpen = targetOpen > 0.5 ? 0 : 1;
            lidSlider.value = targetOpen * 75;
        });

        function animate() {
            requestAnimationFrame(animate);
            currentOpen += (targetOpen - currentOpen) * 0.1;
            lidGroup.rotation.x = -currentOpen * THREE.MathUtils.degToRad(65);
            angleVal.innerText = Math.round(currentOpen * 65);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
